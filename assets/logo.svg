<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="#1a1a2e" stroke="#2d2d44" stroke-width="2"/>

  <!-- Shield shape -->
  <path d="M60 18 L92 32 L92 58 C92 82 60 100 60 100 C60 100 28 82 28 58 L28 32 Z"
        fill="none"
        stroke="url(#shieldGradient)"
        stroke-width="3.5"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Eye outline -->
  <ellipse cx="60" cy="54" rx="18" ry="11"
           fill="none"
           stroke="url(#shieldGradient)"
           stroke-width="2.5"
           filter="url(#glow)"/>

  <!-- Pupil -->
  <circle cx="60" cy="54" r="5" fill="url(#shieldGradient)"/>

  <!-- Eye highlight -->
  <circle cx="62" cy="52" r="1.5" fill="#ffffff" opacity="0.8"/>
</svg>
